version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eigenda_observer
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: observer_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prober/db/migrations.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observer -d eigenda_observer"]
      interval: 5s
      timeout: 3s
      retries: 5

  prober:
    build: ./prober
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://observer:observer_pass@postgres:5432/eigenda_observer?sslmode=disable
      ETH_RPC_URL: ${ETH_RPC_URL}
      DATAAPI_BASE_URL: https://dataapi.eigenda.xyz/api/v2
      PROBE_INTERVAL: 5m
      EIGENDA_DIRECTORY: ${EIGENDA_DIRECTORY:-0x64AB2e9A86FA2E183CB6f01B2D4050c1c2dFAad4}
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://observer:observer_pass@postgres:5432/eigenda_observer?sslmode=disable
    restart: unless-stopped

volumes:
  pgdata:
